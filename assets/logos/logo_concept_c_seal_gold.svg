<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <linearGradient id="goldC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D0"/>
      <stop offset="25%" stop-color="#E1BF68"/>
      <stop offset="50%" stop-color="#B88E2C"/>
      <stop offset="75%" stop-color="#ECCF82"/>
      <stop offset="100%" stop-color="#936714"/>
    </linearGradient>

    <filter id="goldGlowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#D4AF37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="680" rx="24" fill="#080B10"/>

  <!-- Radial Glow -->
  <radialGradient id="auraC" cx="50%" cy="35%" r="40%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#080B10" stop-opacity="0"/>
  </radialGradient>
  <circle cx="300" cy="225" r="210" fill="url(#auraC)"/>

  <!-- GRAND MEDALLION CREST -->
  <g filter="url(#goldGlowC)">
    <!-- Outer beaded circular rim -->
    <circle cx="300" cy="225" r="160" fill="none" stroke="url(#goldC)" stroke-width="2"/>
    <circle cx="300" cy="225" r="148" fill="none" stroke="url(#goldC)" stroke-width="1" stroke-dasharray="3, 4" stroke-opacity="0.7"/>
    <circle cx="300" cy="225" r="136" fill="none" stroke="url(#goldC)" stroke-width="1.5"/>

    <!-- Concentric diamond facet inside the circle -->
    <polygon points="300,95 424,225 300,355 176,225" 
             fill="none" stroke="url(#goldC)" stroke-width="1" stroke-opacity="0.5"/>

    <!-- 4 Cardinal Stars on Ring -->
    <polygon points="300,72 303,77 308,80 303,83 300,88 297,83 292,80 297,77" fill="url(#goldC)"/>
    <polygon points="300,362 303,367 308,370 303,373 300,378 297,373 292,370 297,367" fill="url(#goldC)"/>
    <polygon points="145,225 150,222 153,217 156,222 161,225 156,228 153,233 150,228" fill="url(#goldC)"/>
    <polygon points="455,225 450,222 447,217 444,222 439,225 444,228 447,233 450,228" fill="url(#goldC)"/>

    <!-- Circular curved text in the ring -->
    <path id="curveTop" d="M 160,225 A 140,140 0 0,1 440,225" fill="none"/>
    <path id="curveBottom" d="M 440,225 A 140,140 0 0,1 160,225" fill="none"/>

    <!-- MONOGRAM PW AT CORE -->
    <!-- The P -->
    <path d="M 235,160 L 255,160 L 255,290 L 235,290 Z" fill="url(#goldC)"/>
    <path d="M 255,160 C 298,160 330,178 330,212 C 330,244 298,262 255,262 L 255,242 C 282,242 306,230 306,212 C 306,194 282,180 255,180 Z" fill="url(#goldC)"/>

    <!-- The W -->
    <polygon points="205,210 222,210 262,290 245,290" fill="url(#goldC)"/>
    <polygon points="245,290 262,290 302,210 285,210" fill="url(#goldC)"/>
    <polygon points="288,210 305,210 342,290 325,290" fill="url(#goldC)"/>
    <polygon points="325,290 342,290 380,210 363,210" fill="url(#goldC)"/>
  </g>

  <!-- TYPOGRAPHY -->
  <text x="300" y="480" text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', serif" 
        font-size="34" font-weight="700" letter-spacing="10" 
        fill="url(#goldC)">
    PLUG AND WORK
  </text>

  <text x="300" y="512" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="13" font-weight="600" letter-spacing="10" 
        fill="#E1BF68">
    AGENCY
  </text>

  <line x1="210" y1="535" x2="390" y2="535" stroke="url(#goldC)" stroke-width="1" stroke-opacity="0.4"/>

  <text x="300" y="565" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="11" font-weight="400" letter-spacing="6" 
        fill="#94A3B8">
    COMMERCIALISATION &amp; INVESTISSEMENT
  </text>

  <text x="300" y="610" text-anchor="middle" 
        font-family="'Cinzel', serif" 
        font-size="11" font-style="italic" letter-spacing="4" 
        fill="#A6833B">
    « Here to bring solutions »
  </text>

  <text x="300" y="635" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="9" letter-spacing="4" 
        fill="#64748B">
    CASABLANCA • FONDÉE AU MAROC
  </text>
</svg>
