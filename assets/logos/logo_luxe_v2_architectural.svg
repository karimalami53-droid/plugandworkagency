<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F3DF9A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA7E2D"/>
      <stop offset="100%" stop-color="#DFBA58"/>
    </linearGradient>

    <radialGradient id="auraArch" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05070A" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowArch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.25"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      .title-arch {
        font-family: 'Cormorant Garamond', 'Cinzel', Didot, serif;
        font-weight: 700;
        letter-spacing: 0.42em;
      }
      .sub-arch {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        letter-spacing: 0.6em;
      }
    </style>
  </defs>

  <rect width="800" height="800" fill="#05070B"/>
  <circle cx="400" cy="305" r="230" fill="url(#auraArch)"/>

  <!-- Minimalist Corner Marks -->
  <g stroke="url(#goldArch)" stroke-width="1" stroke-opacity="0.3">
    <path d="M 40,60 L 40,40 L 60,40"/>
    <path d="M 760,60 L 760,40 L 740,40"/>
    <path d="M 40,740 L 40,760 L 60,760"/>
    <path d="M 760,740 L 760,760 L 740,760"/>
  </g>

  <!-- EMBLEM: ARCHITECTURAL JEWEL CARTUCHE -->
  <g filter="url(#shadowArch)">
    <!-- Slender 8-Sided Architectural Facet -->
    <polygon points="400,140 520,195 520,415 400,470 280,415 280,195" 
             fill="none" stroke="url(#goldArch)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner Hairline -->
    <polygon points="400,154 506,203 506,407 400,456 294,407 294,203" 
             fill="none" stroke="url(#goldArch)" stroke-width="1" stroke-opacity="0.45"/>

    <!-- Cardinal Dots -->
    <circle cx="400" cy="140" r="3" fill="#FFFFFF"/>
    <circle cx="400" cy="470" r="3" fill="#FFFFFF"/>
    <circle cx="280" cy="305" r="2" fill="url(#goldArch)"/>
    <circle cx="520" cy="305" r="2" fill="url(#goldArch)"/>

    <!-- MODERN INTERLOCKING ARCHITECTURAL MONOGRAM (CONTINUOUS GOLD STROKE) -->
    <!-- P Stem -->
    <line x1="345" y1="225" x2="345" y2="395" stroke="url(#goldArch)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- P Bowl (Golden Ratio Arch) -->
    <path d="M 345,225 C 410,225 435,255 435,285 C 435,315 410,345 345,345" 
          fill="none" stroke="url(#goldArch)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- W Wave (Dynamic Interlocking Geometric Ribbon) -->
    <path d="M 305,290 L 350,395 L 385,305 L 420,395 L 465,290" 
          fill="none" stroke="url(#goldArch)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Accent Center Stud -->
    <polygon points="400,285 403,288 400,291 397,288" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY: EDITORIAL HAUTE COUTURE -->
  <text x="400" y="560" text-anchor="middle" 
        class="title-arch"
        font-size="40" 
        fill="url(#goldArch)">
    PLUG &amp; WORK
  </text>

  <line x1="280" y1="585" x2="520" y2="585" stroke="url(#goldArch)" stroke-width="0.8" stroke-opacity="0.4"/>

  <text x="400" y="618" text-anchor="middle" 
        class="sub-arch"
        font-size="13" 
        fill="#F3DF9A">
    A G E N C Y
  </text>

  <text x="400" y="648" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-weight="500" 
        font-size="10.5" 
        letter-spacing="0.45em" 
        fill="#94A3B8">
    IMMOBILIER DE PRESTIGE &amp; SOLUTIONS
  </text>

  <text x="400" y="694" text-anchor="middle" 
        font-family="'Cormorant Garamond', Georgia, serif" 
        font-style="italic" 
        font-size="14" 
        letter-spacing="0.2em" 
        fill="#C5A059">
    « Here to bring solutions »
  </text>

  <text x="400" y="722" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="9" 
        letter-spacing="0.4em" 
        fill="#64748B">
    CASABLANCA • MAROC
  </text>
</svg>
