<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="20%" stop-color="#E9CB7E"/>
      <stop offset="45%" stop-color="#C89D3C"/>
      <stop offset="70%" stop-color="#EED58E"/>
      <stop offset="90%" stop-color="#9E7220"/>
      <stop offset="100%" stop-color="#C89D3C"/>
    </linearGradient>

    <filter id="goldGlowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Transparent or dark background support -->
  <rect width="760" height="160" rx="16" fill="#070A0F"/>

  <!-- EMBLEM ON LEFT (Centered at x=90, y=80, scale 0.36) -->
  <g transform="translate(90, 80) scale(0.34)" filter="url(#goldGlowH)">
    <!-- Outer Faceted Diamond / Hexagon Crest -->
    <polygon points="0,-183 145,-93 145,83 0,173 -145,83 -145,-93" 
             fill="none" stroke="url(#goldH)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Inner Concentric Frame -->
    <polygon points="0,-167 130,-86 130,74 0,155 -130,74 -130,-86" 
             fill="none" stroke="url(#goldH)" stroke-width="2.5" stroke-opacity="0.6" stroke-linejoin="round"/>

    <!-- Corner facet accent ticks -->
    <line x1="0" y1="-183" x2="0" y2="-167" stroke="url(#goldH)" stroke-width="3"/>
    <line x1="145" y1="-93" x2="130" y2="-86" stroke="url(#goldH)" stroke-width="3"/>
    <line x1="145" y1="83" x2="130" y2="74" stroke="url(#goldH)" stroke-width="3"/>
    <line x1="0" y1="173" x2="0" y2="155" stroke="url(#goldH)" stroke-width="3"/>
    <line x1="-145" y1="83" x2="-130" y2="74" stroke="url(#goldH)" stroke-width="3"/>
    <line x1="-145" y1="-93" x2="-130" y2="-86" stroke="url(#goldH)" stroke-width="3"/>

    <!-- Top North-Star Diamond Accent -->
    <g transform="translate(0, -199)">
      <path d="M 0,-14 L 4,-2 L 15,0 L 4,2 L 0,14 L -4,2 L -15,0 L -4,-2 Z" fill="url(#goldH)"/>
    </g>

    <!-- The "P" -->
    <path d="M -84,-90 L -54,-90 L -54,90 L -84,90 Z" fill="url(#goldH)"/>
    <path d="M -95,-90 L -43,-90 L -43,-84 L -54,-84 L -54,-82 L -84,-82 L -84,-84 L -95,-84 Z" fill="url(#goldH)"/>
    <path d="M -95,90 L -43,90 L -43,84 L -54,84 L -54,82 L -84,82 L -84,84 L -95,84 Z" fill="url(#goldH)"/>
    <path d="M -54,-90 C 5,-90 52,-65 52,-19 C 52,25 5,50 -54,50 L -54,21 C -15,21 18,5 18,-19 C 18,-45 -15,-61 -54,-61 Z" fill="url(#goldH)"/>

    <!-- The "W" -->
    <polygon points="-128,-23 -102,-23 -42,93 -66,93" fill="url(#goldH)"/>
    <polygon points="-134,-23 -96,-23 -96,-18 -102,-18 -128,-18 -134,-18" fill="url(#goldH)"/>
    <polygon points="-66,93 -42,93 12,-7 -12,-7" fill="url(#goldH)"/>
    <polygon points="-8,-7 16,-7 68,93 44,93" fill="url(#goldH)"/>
    <polygon points="44,93 68,93 124,-23 98,-23" fill="url(#goldH)"/>
    <polygon points="92,-23 130,-23 130,-18 124,-18 98,-18 92,-18" fill="url(#goldH)"/>
    <rect x="-70" y="90" width="32" height="4" rx="1" fill="url(#goldH)"/>
    <rect x="40" y="90" width="32" height="4" rx="1" fill="url(#goldH)"/>
  </g>

  <!-- Elegant Vertical Divider -->
  <line x1="175" y1="36" x2="175" y2="124" stroke="url(#goldH)" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- TYPOGRAPHY ON RIGHT -->
  <g transform="translate(205, 0)">
    <!-- Main Title: PLUG & WORK -->
    <text x="0" y="70" 
          font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif" 
          font-size="34" font-weight="700" letter-spacing="10" 
          fill="url(#goldH)">
      PLUG &amp; WORK
    </text>

    <!-- Subtitle: AGENCY • REAL ESTATE & PRESTIGE -->
    <text x="2" y="98" 
          font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" 
          font-size="12" font-weight="600" letter-spacing="9" 
          fill="#E8CE95">
      AGENCY <tspan fill="#A6833B" font-weight="300" letter-spacing="4">|</tspan> IMMOBILIER DE PRESTIGE
    </text>

    <!-- Hallmark / Slogan: Here to bring solutions -->
    <text x="2" y="122" 
          font-family="'Cinzel', serif" 
          font-size="10.5" font-style="italic" font-weight="400" letter-spacing="3.5" 
          fill="#94A3B8">
      « Here to bring solutions » • Casablanca
    </text>
  </g>
</svg>
