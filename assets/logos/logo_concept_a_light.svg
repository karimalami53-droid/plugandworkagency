<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <!-- Rich deep obsidian gold gradient for light surfaces -->
    <linearGradient id="goldLightMode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C29B38"/>
      <stop offset="35%" stop-color="#A67C1E"/>
      <stop offset="70%" stop-color="#846014"/>
      <stop offset="100%" stop-color="#B3892B"/>
    </linearGradient>

    <linearGradient id="darkText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#1B2230"/>
    </linearGradient>
  </defs>

  <!-- Luxury Pure Alabaster Background -->
  <rect width="600" height="680" rx="24" fill="#FDFCF9" stroke="#EAE5DA" stroke-width="2"/>

  <!-- ================= EMBLEM CONTAINER ================= -->
  <g transform="translate(0, 0)">
    <!-- Outer Faceted Diamond / Hexagon Crest -->
    <polygon points="300,52 445,142 445,318 300,408 155,318 155,142" 
             fill="none" stroke="url(#goldLightMode)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Inner Concentric Frame -->
    <polygon points="300,68 430,149 430,309 300,390 170,309 170,149" 
             fill="none" stroke="url(#goldLightMode)" stroke-width="1" stroke-opacity="0.6" stroke-linejoin="round"/>

    <!-- Corner facet accent ticks -->
    <line x1="300" y1="52" x2="300" y2="68" stroke="url(#goldLightMode)" stroke-width="1.5"/>
    <line x1="445" y1="142" x2="430" y2="149" stroke="url(#goldLightMode)" stroke-width="1.5"/>
    <line x1="445" y1="318" x2="430" y2="309" stroke="url(#goldLightMode)" stroke-width="1.5"/>
    <line x1="300" y1="408" x2="300" y2="390" stroke="url(#goldLightMode)" stroke-width="1.5"/>
    <line x1="155" y1="318" x2="170" y2="309" stroke="url(#goldLightMode)" stroke-width="1.5"/>
    <line x1="155" y1="142" x2="170" y2="149" stroke="url(#goldLightMode)" stroke-width="1.5"/>

    <!-- Top North-Star Diamond Accent -->
    <g transform="translate(300, 36)">
      <path d="M 0,-8 L 2.5,-1 L 9,0 L 2.5,1 L 0,8 L -2.5,1 L -9,0 L -2.5,-1 Z" fill="url(#goldLightMode)"/>
    </g>

    <!-- The "P" (Obsidian & Deep Gold) -->
    <path d="M 216,145 L 246,145 L 246,325 L 216,325 Z" fill="url(#darkText)"/>
    <path d="M 205,145 L 257,145 L 257,151 L 246,151 L 246,153 L 216,153 L 216,151 L 205,151 Z" fill="url(#darkText)"/>
    <path d="M 205,325 L 257,325 L 257,319 L 246,319 L 246,317 L 216,317 L 216,319 L 205,319 Z" fill="url(#darkText)"/>
    <path d="M 246,145 C 305,145 352,170 352,216 C 352,260 305,285 246,285 L 246,256 C 285,256 318,240 318,216 C 318,190 285,174 246,174 Z" 
          fill="url(#darkText)"/>

    <!-- The "W" Interlocking in Pure Gold -->
    <polygon points="172,212 198,212 258,328 234,328" fill="url(#goldLightMode)"/>
    <polygon points="166,212 204,212 204,217 198,217 172,217 166,217" fill="url(#goldLightMode)"/>

    <polygon points="234,328 258,328 312,228 288,228" fill="url(#goldLightMode)"/>

    <polygon points="292,228 316,228 368,328 344,328" fill="url(#goldLightMode)"/>

    <polygon points="344,328 368,328 424,212 398,212" fill="url(#goldLightMode)"/>
    <polygon points="392,212 430,212 430,217 424,217 398,217 392,217" fill="url(#goldLightMode)"/>

    <rect x="230" y="325" width="32" height="4" rx="1" fill="url(#goldLightMode)"/>
    <rect x="340" y="325" width="32" height="4" rx="1" fill="url(#goldLightMode)"/>
  </g>

  <!-- ================= LUXURY TYPOGRAPHY ================= -->
  <!-- Brand Name: PLUG & WORK -->
  <text x="300" y="492" text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', serif" 
        font-size="34" font-weight="700" letter-spacing="11" 
        fill="url(#darkText)">
    PLUG &amp; WORK
  </text>

  <!-- Subtle divider rule with gold diamond center -->
  <line x1="200" y1="518" x2="275" y2="518" stroke="url(#goldLightMode)" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="300,515 303,518 300,521 297,518" fill="url(#goldLightMode)"/>
  <line x1="325" y1="518" x2="400" y2="518" stroke="url(#goldLightMode)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Subtitle -->
  <text x="300" y="546" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="13" font-weight="700" letter-spacing="10" 
        fill="url(#goldLightMode)">
    AGENCY
  </text>

  <text x="300" y="572" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="10.5" font-weight="600" letter-spacing="8" 
        fill="#576375">
    IMMOBILIER DE PRESTIGE &amp; SOLUTIONS
  </text>

  <!-- Signature Motto -->
  <text x="300" y="618" text-anchor="middle" 
        font-family="'Cinzel', serif" 
        font-size="11" font-style="italic" font-weight="500" letter-spacing="4" 
        fill="#846014">
    « Here to bring solutions »
  </text>

  <text x="300" y="642" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="9" font-weight="500" letter-spacing="4" 
        fill="#8A95A5">
    CASABLANCA • MAROC
  </text>
</svg>
