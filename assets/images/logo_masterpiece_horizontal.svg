<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldHFix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2"/>
      <stop offset="15%" stop-color="#F7E6B5"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="55%" stop-color="#B88A28"/>
      <stop offset="75%" stop-color="#F2DC99"/>
      <stop offset="90%" stop-color="#8C6314"/>
      <stop offset="100%" stop-color="#D9B44E"/>
    </linearGradient>

    <radialGradient id="velvetAuraHFix" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlowHFix" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1050" height="180" rx="16" fill="#05070B"/>
  <circle cx="105" cy="90" r="85" fill="url(#velvetAuraHFix)"/>

  <!-- EMBLEM ON LEFT (Centered at x=105, y=90, scale 0.38) -->
  <g transform="translate(105, 90) scale(0.38)" filter="url(#softGlowHFix)">
    <polygon points="0,-165 128,-94 128,94 0,165 -128,94 -128,-94" 
             fill="none" stroke="url(#goldHFix)" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="0,-149 114,-86 114,86 0,149 -114,86 -114,-86" 
             fill="none" stroke="url(#goldHFix)" stroke-width="2" stroke-opacity="0.5" stroke-linejoin="round"/>

    <!-- North Star Top -->
    <path d="M 0,-182 L 4,-172 L 14,-170 L 4,-168 L 0,-158 L -4,-168 L -14,-170 L -4,-172 Z" fill="url(#goldHFix)"/>
    
    <!-- P -->
    <rect x="-52" y="-85" width="10" height="160" fill="url(#goldHFix)"/>
    <polygon points="-60,-85 -34,-85 -34,-82 -42,-82 -42,-80 -52,-80 -52,-82 -60,-82" fill="url(#goldHFix)"/>
    <polygon points="-62,75 -32,75 -32,72 -42,72 -42,70 -52,70 -52,72 -62,72" fill="url(#goldHFix)"/>
    <path d="M -42,-85 C 0,-85 32,-67 32,-32 C 32,3 0,21 -42,21 L -42,10 C -10,10 18,-5 18,-32 C 18,-59 -10,-74 -42,-74 Z" fill="url(#goldHFix)"/>

    <!-- W -->
    <polygon points="-88,-25 -72,-25 -30,75 -46,75" fill="url(#goldHFix)"/>
    <polygon points="-46,75 -32,75 4,-12 -8,-12" fill="url(#goldHFix)"/>
    <polygon points="-4,-12 8,-12 46,75 32,75" fill="url(#goldHFix)"/>
    <polygon points="32,75 46,75 82,-25 68,-25" fill="url(#goldHFix)"/>
    <circle cx="-1" cy="-10" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Elegant Vertical Hairline Divider -->
  <line x1="200" y1="30" x2="200" y2="150" stroke="url(#goldHFix)" stroke-width="1" stroke-opacity="0.35"/>

  <!-- TYPOGRAPHY ON RIGHT -->
  <g transform="translate(230, 0)">
    <!-- Title in Didot Bold -->
    <text x="0" y="78" 
          font-family="'Didot', 'Bodoni 72', 'Baskerville', serif" 
          font-size="42" 
          font-weight="bold" 
          letter-spacing="12" 
          fill="url(#goldHFix)">
      PLUG &amp; WORK
    </text>

    <!-- Subtitle: AGENCY | IMMOBILIER DE PRESTIGE -->
    <text x="3" y="112" 
          font-family="'Didot', 'Bodoni 72', serif" 
          font-size="14" 
          font-weight="normal" 
          letter-spacing="9" 
          fill="#F7E6B5">
      A G E N C Y <tspan fill="#A67E2D" font-weight="300" letter-spacing="3">|</tspan> IMMOBILIER DE PRESTIGE
    </text>

    <!-- Slogan -->
    <text x="3" y="140" 
          font-family="'Didot', Georgia, serif" 
          font-style="italic" 
          font-size="12" 
          letter-spacing="2.5" 
          fill="#94A3B8">
      « Here to bring solutions » • Casablanca
    </text>
  </g>
</svg>
