<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="100%" height="100%">
  <defs>
    <!-- Ultra-Luxe Polished 24K Champagne Gold -->
    <linearGradient id="goldDidot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2"/>
      <stop offset="15%" stop-color="#F7E6B5"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="55%" stop-color="#B88A28"/>
      <stop offset="75%" stop-color="#F2DC99"/>
      <stop offset="90%" stop-color="#8C6314"/>
      <stop offset="100%" stop-color="#D9B44E"/>
    </linearGradient>

    <!-- Warm Hairline Gold for Borders -->
    <linearGradient id="goldHairline" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6318"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFF8E0"/>
    </linearGradient>

    <!-- Ambient Velvet Illumination -->
    <radialGradient id="velvetAura" cx="50%" cy="36%" r="42%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>

    <!-- Realistic Fine Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#D4AF37" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Deep Velvet Obsidian Canvas -->
  <rect width="800" height="860" fill="#05070B"/>
  
  <!-- Subtle Border Framing (Luxury Certificate / Seal style) -->
  <rect x="25" y="25" width="750" height="810" rx="14" fill="none" stroke="url(#goldHairline)" stroke-width="0.8" stroke-opacity="0.22"/>
  <rect x="33" y="33" width="734" height="794" rx="10" fill="none" stroke="url(#goldHairline)" stroke-width="0.4" stroke-opacity="0.12"/>
  
  <!-- Corner Chamfer Ticks -->
  <g stroke="url(#goldHairline)" stroke-width="0.8" stroke-opacity="0.4">
    <path d="M 25,45 L 45,45 L 45,25"/>
    <path d="M 775,45 L 755,45 L 755,25"/>
    <path d="M 25,815 L 45,815 L 45,835"/>
    <path d="M 775,815 L 755,815 L 755,835"/>
  </g>

  <!-- Central Aura -->
  <circle cx="400" cy="305" r="230" fill="url(#velvetAura)"/>

  <!-- ================= MASTER EMBLEM CREST ================= -->
  <g filter="url(#softGlow)">
    
    <!-- Outer Faceted Emerald-Cut Diamond (Razor-sharp 1.8px line) -->
    <polygon points="400,135 528,206 528,394 400,465 272,394 272,206" 
             fill="none" stroke="url(#goldDidot)" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Inner Concentric Diamond Facet -->
    <polygon points="400,151 514,214 514,386 400,449 286,386 286,214" 
             fill="none" stroke="url(#goldDidot)" stroke-width="0.75" stroke-opacity="0.45" stroke-linejoin="round"/>

    <!-- Corner Diagonal Facet Connectors -->
    <line x1="400" y1="135" x2="400" y2="151" stroke="url(#goldDidot)" stroke-width="1"/>
    <line x1="528" y1="206" x2="514" y2="214" stroke="url(#goldDidot)" stroke-width="1"/>
    <line x1="528" y1="394" x2="514" y2="386" stroke="url(#goldDidot)" stroke-width="1"/>
    <line x1="400" y1="465" x2="400" y2="449" stroke="url(#goldDidot)" stroke-width="1"/>
    <line x1="272" y1="394" x2="286" y2="386" stroke="url(#goldDidot)" stroke-width="1"/>
    <line x1="272" y1="206" x2="286" y2="214" stroke="url(#goldDidot)" stroke-width="1"/>

    <!-- Apex North Star (8-Point Diamond Star) -->
    <g transform="translate(400, 116)">
      <path d="M 0,-11 L 2.5,-2.5 L 11,0 L 2.5,2.5 L 0,11 L -2.5,2.5 L -11,0 L -2.5,-2.5 Z" fill="url(#goldDidot)"/>
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Hallmark Rhombus -->
    <polygon points="400,480 404,484 400,488 396,484" fill="url(#goldDidot)"/>

    <!-- ================= HAUTE JOAILLERIE MONOGRAM: P & W ================= -->
    
    <!-- THE 'P' (Classical Didot Serif Geometry) -->
    <!-- P Vertical Column: x=348 to 358 (10px width), y=215 to 375 -->
    <rect x="348" y="215" width="10" height="160" fill="url(#goldDidot)"/>
    <!-- P Top Serif -->
    <polygon points="340,215 366,215 366,218 358,218 358,220 348,220 348,218 340,218" fill="url(#goldDidot)"/>
    <!-- P Bottom Serif -->
    <polygon points="338,375 368,375 368,372 358,372 358,370 348,370 348,372 338,372" fill="url(#goldDidot)"/>

    <!-- P Semicircular Upper Bowl -->
    <!-- Outer loop sweeps to x=430, inner loop cut out smoothly -->
    <path d="M 358,215 C 400,215 432,233 432,268 C 432,303 400,321 358,321 L 358,310 C 390,310 418,295 418,268 C 418,241 390,226 358,226 Z" 
          fill="url(#goldDidot)"/>

    <!-- THE 'W' (Interlocking Calligraphic Didot) -->
    <!-- W Left Diagonal (Descending, Thick): from (312, 275) down to (362, 375) -->
    <polygon points="312,275 328,275 370,375 354,375" fill="url(#goldDidot)"/>
    <!-- Top terminal serif on left diagonal -->
    <polygon points="306,275 334,275 334,278 328,278 312,278 306,278" fill="url(#goldDidot)"/>

    <!-- W Middle Upstroke (Ascending, Thin Hairline, passes behind P): from (354, 375) up to (396, 288) -->
    <polygon points="354,375 368,375 404,288 392,288" fill="url(#goldDidot)"/>

    <!-- W Middle Downstroke (Descending, Thick): from (396, 288) down to (438, 375) -->
    <polygon points="396,288 408,288 446,375 432,375" fill="url(#goldDidot)"/>

    <!-- W Right Upstroke (Ascending, Thin Hairline): from (432, 375) up to (474, 275) -->
    <polygon points="432,375 446,375 482,275 468,275" fill="url(#goldDidot)"/>
    <!-- Right terminal serif -->
    <polygon points="462,275 490,275 490,278 482,278 468,278 462,278" fill="url(#goldDidot)"/>

    <!-- Bottom Foot Serifs on W -->
    <rect x="350" y="373" width="22" height="2.5" rx="0.5" fill="url(#goldDidot)"/>
    <rect x="428" y="373" width="20" height="2.5" rx="0.5" fill="url(#goldDidot)"/>

    <!-- Delicate central star jewel at center junction -->
    <circle cx="399" cy="290" r="2" fill="#FFFFFF"/>
  </g>

  <!-- ================= TYPOGRAPHIE HAUTE HORLOGERIE & JOAILLERIE ================= -->
  
  <!-- Main Title: PLUG & WORK in Didot Bold, Generous Tracking -->
  <text x="400" y="555" text-anchor="middle" 
        font-family="'Didot', 'Bodoni 72', 'Baskerville', 'Cinzel', serif" 
        font-size="44" 
        font-weight="bold" 
        letter-spacing="14" 
        fill="url(#goldDidot)">
    PLUG &amp; WORK
  </text>

  <!-- Elegant Divider Rule with Diamond Accent -->
  <g transform="translate(400, 582)">
    <line x1="-140" y1="0" x2="-25" y2="0" stroke="url(#goldDidot)" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="url(#goldDidot)"/>
    <circle cx="-12" cy="0" r="1.2" fill="url(#goldDidot)" opacity="0.6"/>
    <circle cx="12" cy="0" r="1.2" fill="url(#goldDidot)" opacity="0.6"/>
    <line x1="25" y1="0" x2="140" y2="0" stroke="url(#goldDidot)" stroke-width="0.8" stroke-opacity="0.6"/>
  </g>

  <!-- Subtitle: AGENCY (Exquisite Didot Small Caps Tracking) -->
  <text x="400" y="622" text-anchor="middle" 
        font-family="'Didot', 'Bodoni 72', serif" 
        font-size="16" 
        font-weight="normal" 
        letter-spacing="18" 
        fill="#F7E6B5">
    A G E N C Y
  </text>

  <!-- Business Category: IMMOBILIER DE PRESTIGE & SOLUTIONS -->
  <text x="400" y="656" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="6" 
        fill="#94A3B8">
    IMMOBILIER DE PRESTIGE &amp; SOLUTIONS
  </text>

  <!-- Hallmark Slogan: « Here to bring solutions » in Italic Didot -->
  <text x="400" y="706" text-anchor="middle" 
        font-family="'Didot', 'Baskerville', Georgia, serif" 
        font-style="italic" 
        font-size="14" 
        letter-spacing="3" 
        fill="#C59E3D">
    « Here to bring solutions »
  </text>

  <!-- Territory Hallmark: CASABLANCA • MAROC -->
  <text x="400" y="738" text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="9" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#64748B">
    CASABLANCA • FONDÉE AU MAROC
  </text>
</svg>
